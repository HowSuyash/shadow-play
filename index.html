<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#120a06" />
    <link rel="icon" href="data:," />
    <title>Shadow Play</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0604;
        overflow: hidden;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #scene-container {
        position: fixed;
        inset: 0;
      }
      #lobby {
        position: fixed;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        z-index: 10;
        color: #f6dfb0;
        text-align: center;
      }
      #lobby[hidden],
      #lobby [hidden] {
        display: none !important;
      }
      .row {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        min-width: 150px;
        padding: 18px 40px;
        font: 600 26px Georgia, serif;
        letter-spacing: 0.06em;
        color: #2b1709;
        background: radial-gradient(circle at 50% 40%, #ffe2a8, #e8a95a);
        border: 2px solid #ffcf86;
        border-radius: 48px;
        box-shadow: 0 0 34px #ff9a3c77;
        cursor: pointer;
      }
      .btn.ghost {
        color: #f6dfb0;
        background: rgba(40, 20, 8, 0.75);
        border-color: #a8774a;
        box-shadow: none;
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .code {
        font: 700 64px Georgia, serif;
        letter-spacing: 0.3em;
        text-shadow: 0 0 22px #ff9a3c;
        min-height: 76px;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 84px);
        gap: 10px;
      }
      .keypad .btn {
        min-width: 0;
        padding: 16px 0;
        font-size: 30px;
      }
      #keys-help {
        position: fixed;
        left: 50%;
        bottom: 3%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 12px 22px;
        color: #f6dfb0;
        background: rgba(30, 14, 6, 0.82);
        border: 1px solid #8a5a2a;
        border-radius: 14px;
        font: 17px Georgia, serif;
        text-align: center;
        line-height: 1.6;
      }
      #keys-help[hidden] {
        display: none;
      }
      #keys-help b {
        display: inline-block;
        min-width: 22px;
        padding: 0 6px;
        margin: 0 2px;
        color: #2b1709;
        background: #e9cf9c;
        border-radius: 5px;
      }
      .status {
        font: italic 18px Georgia, serif;
        color: #e8c48f;
        min-height: 22px;
      }
      #boot-note {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 3%;
        text-align: center;
        color: #c9a57a;
        font-size: 15px;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="lobby" hidden>
      <div id="lobby-main" class="row">
        <button class="btn" id="play-solo">Play</button>
        <button class="btn ghost" id="play-coop">Play together</button>
        <button class="btn ghost" id="play-screen" hidden>Play on screen</button>
      </div>
      <div id="lobby-coop" class="row" hidden>
        <button class="btn" id="coop-host">Host a room</button>
        <button class="btn" id="coop-join">Join a room</button>
        <button class="btn ghost" id="coop-back">Back</button>
      </div>
      <div id="lobby-host" hidden>
        <div class="status">Tell your partner this code</div>
        <div class="code" id="host-code"></div>
        <button class="btn" id="host-enter">Enter VR</button>
      </div>
      <div id="lobby-join" hidden>
        <div class="code" id="join-code"></div>
        <div class="keypad" id="keypad"></div>
        <div class="row" style="margin-top: 12px">
          <button class="btn" id="join-enter" disabled>Join &amp; enter VR</button>
        </div>
      </div>
      <div class="status" id="lobby-status"></div>
    </div>
    <div id="boot-note">Hands only &middot; seated &middot; about 5 minutes</div>
    <div id="keys-help" hidden>
      Computer demo &mdash; the real game is played with your hands in a Meta Quest<br />
      <b>Enter</b> start &nbsp; <b>1</b> dog &nbsp; <b>2</b> bird &nbsp; <b>3</b> rabbit &nbsp; <b>4</b> snake
      &nbsp; <b>P</b> pause &nbsp; <b>Esc</b> leave &nbsp;&middot;&nbsp; menu: <b>V</b> duel <b>M</b> memory <b>G</b> gallery
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
